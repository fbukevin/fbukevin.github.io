languageCode = 'en-us'
title = "Program City"
theme = 'anatole'

[markup]
    [markup.goldmark]
        [markup.goldmark.renderer]
        unsafe=false

[taxonomies]
    category = "categories"
    series = "series"
    tag = "tags"

[module]
